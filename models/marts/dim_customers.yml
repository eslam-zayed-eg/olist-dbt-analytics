version: 2

models:
  - name: dim_customers
    description: "Customer dimension for Olist e-commerce analytics"

    columns:
      - name: customer_id
        description: "Unique identifier for each customer record"
        data_tests:
          - not_null
          - unique

      - name: customer_unique_id
        description: "Identifier for the real customer across orders"
        data_tests:
          - not_null