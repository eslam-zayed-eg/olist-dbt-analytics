
version: 2

models:
  - name: mart_customer_sales
    description: "Customer-level sales analytics aggregated by customer and location"

    columns:
      - name: customer_unique_id
        data_tests:
          - not_null

      - name: customer_city
        data_tests:
          - not_null

      - name: customer_state
        data_tests:
          - not_null

      - name: total_orders
        data_tests:
          - not_null

      - name: total_sales
        data_tests:
          - not_null

      - name: total_amount
        data_tests:
          - not_null